name: Android Canary OSS Debug Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-canary-oss-debug:
    name: Build canary OSS debug APK (UnifiedPush)
    runs-on: macos-26
    environment: release-builds

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Sync submodules
        run: git submodule update --init --recursive

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-canary-oss-debug-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-canary-oss-debug-
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable

      - name: Restore pub cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Configure OSS build tree
        run: dart tool/configure_build.dart --profile=oss

      - name: Set up Rust for the native markdown parser
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            . "$HOME/.cargo/env"
          fi
          rustup show active-toolchain || rustup toolchain install stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          flutter config --enable-native-assets

      - name: Resolve unifiedpush_linux to the stub
        run: bash tool/apply_macos_pub_overrides.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build

      - name: Write Measure Android config
        env:
          MEASURE_RELEASE_CHANNEL: canary
          MEASURE_ANDROID_API_KEY_CANARY: ${{ secrets.MEASURE_ANDROID_API_KEY_CANARY }}
          MEASURE_ANDROID_API_KEY: ${{ secrets.MEASURE_ANDROID_API_KEY }}
          MEASURE_API_URL: ${{ secrets.MEASURE_API_URL }}
        run: tool/measure/write_native_measure_config.sh

      - name: Build canary OSS split debug APKs
        run: |
          flutter build apk \
            --debug \
            --split-per-abi \
            --flavor canaryUnifiedpush \
            --dart-define-from-file=tool/dart_defines/canary.json \
            --dart-define=PUSH_PROVIDER=unifiedpush \
            --dart-define=BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Build canary OSS combined debug APK
        run: |
          flutter build apk \
            --debug \
            --flavor canaryUnifiedpush \
            --dart-define-from-file=tool/dart_defines/canary.json \
            --dart-define=PUSH_PROVIDER=unifiedpush \
            --dart-define=BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload canary OSS debug APK artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: canary-oss-debug-apk
          path: build/app/outputs/flutter-apk/*-debug.apk
          if-no-files-found: error
