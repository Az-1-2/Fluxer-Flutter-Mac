name: Sync Upstream

on:
  schedule:
    # Каждый день в 03:00 UTC (06:00 МСК)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true

      - name: Sync with upstream
        run: |
          git remote add parent https://github.com/fluxerapp/flutter_client.git || true
          git fetch parent canary

          git checkout upstream/canary || true
          git add -A
          git diff --cached --quiet || \

          merge_and_resolve() {
            branch="$1"
            echo "Merging $branch"

            if git merge "$branch" -X theirs --no-edit; then
              return 0
            fi

            # If the merge failed for a reason other than file conflicts, stop.
            git diff --name-only --diff-filter=U -z > /tmp/merge-conflicts
            if [ ! -s /tmp/merge-conflicts ]; then
              echo "Merge failed without file conflicts."
              return 1
            fi

            # Resolve conflicts in favor of the incoming branch.
            while IFS= read -r -d '' file; do
              git checkout --theirs -- "$file" ||
                git rm -f --ignore-unmatch -- "$file"
            done < /tmp/merge-conflicts

            git add -A
            git commit --no-verify -m "chore: sync $branch (auto-resolve conflicts)"
          }
          
          merge_and_resolve parent/canary
          
      - name: Restore workflows
        run: |
          for f in \
            .github/workflows/macos-canary-testflight.yml \ do
            git checkout origin/main -- "$f" 2>/dev/null || true
          done
          git add -A
          git diff --cached --quiet || git commit -m "chore: keep workflows" || true

      - name: Push changes
        run: git push origin main
