name: macOS Test Build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-upload:
    name: Build and release as artifact
    runs-on: macos-26
    environment: release-builds
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Sync submodules
        run: git submodule update --init --recursive

      - name: Set up Flutter
        # Temp use while waiting for a PR: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable

      - name: Set up Rust and native asset build hooks
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            . "$HOME/.cargo/env"
          fi
          rustup show active-toolchain || rustup toolchain install stable
          flutter config --enable-native-assets

      - name: Restore pub cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Configure OSS build tree
        run: dart tool/configure_build.dart --profile=oss

      - name: Apply macOS dependency overrides
        run: bash tool/apply_macos_pub_overrides.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build

      - name: Set up Ruby
        uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5
        with:
          ruby-version: "4.0"

      - name: Restore Bundler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundler-ruby-4.0-${{ hashFiles('Gemfile.lock', 'Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-bundler-ruby-4.0-

      - name: Install Ruby gems
        run: |
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Prepare macOS project files
        run: |
          flutter build macos --config-only
          pod install --project-directory=macos

      - name: Build macOS app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos \
            -resultBundlePath build/macos/Runner.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-diagnostics
          path: |
            xcodebuild.log
            build/macos/Runner.xcresult
          if-no-files-found: warn

      - name: Package app
        run: |
          APP="build/macos/Build/Products/Release/Fluxer.app"
          test -d "$APP" || { echo "App not found at $APP"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$APP" Fluxer-macos.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-canary
          path: Fluxer-macos.zip
          if-no-files-found: error
          retention-days: 14
